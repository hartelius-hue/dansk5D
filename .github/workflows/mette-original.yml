name: Byg Mette-GIF ud fra originalportræt
on:
  push:
    paths:
      - qa/generate_mette_original_gif.py
      - .github/workflows/mette-original.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer billedbibliotek
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Byg animation udelukkende fra Mettes originale foto
        run: python qa/generate_mette_original_gif.py
      - name: Gem de to animerede billedfiler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mette-original-animeret.gif assets/mette-original-animeret.webp
          if ! git diff --cached --quiet; then
            git commit -m "Tilføj diskret GIF med Mettes ægte ansigt og hår"
            git push origin HEAD:main
          fi

name: Dansk5D QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxcheck JavaScript
        run: |
          node --check data.js
          node --check app.js
      - name: Kontroller opgaver, tre niveauer og lokale assets
        run: node qa/check.cjs
      - name: Test desktop, mobil og elevnavigation i Chromium
        run: |
          npm install --no-save --ignore-scripts playwright-core
          node qa/visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dansk5d-visuel-kontrol
          path: qa/screenshots/*.png
          if-no-files-found: ignore

name: Dansk5D QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxcheck JavaScript
        run: |
          node --check data.js
          node --check app.js
      - name: Kontroller opgaver, tre niveauer og lokale assets
        run: node qa/check.cjs
